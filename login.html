<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkiPointment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // config keys
        const firebaseConfig = {
            apiKey: "AIzaSyDWbXPNHbF5Hj4rQ8lwQA_C1cnqmpHltsc", // Fixed master key
            authDomain: "arkipointment.firebaseapp.com",
            projectId: "arkipointment",
            storageBucket: "arkipointment.firebasestorage.app",
            messagingSenderId: "19182685710",
            appId: "1:19182685710:web:89ee8beb8c11705b85765f",
            databaseURL: "https://arkipointment-default-rtdb.firebaseio.com",
            measurementId: "G-VYD11J6HM5"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const database = firebase.database();
    </script>

    <div class="app-container">
        <div class="blueprint-bg"></div>
        <div class="shadow-orb"></div>

        <header class="main-header">
            <h1 class="logo">ArkiPointment</h1>
            <p class="tagline">Book an appointment with one of our Architects now!</p>
        </header>

        <div id="welcomeCard" class="auth-card visible">
            <div class="gate-buttons">
                <button class="primary-btn" onclick="switchCard('loginCard')">Login</button>
                <button class="link-btn" onclick="switchCard('registerCard')">Register</button>
            </div>
        </div>

        <div id="loginCard" class="auth-card hidden">
            <div class="form-box">
                <h2>Login</h2>
                <form id="loginForm" onsubmit="executeLogin(event)">
                    <input type="email" id="loginEmail" placeholder="Email Address" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit" class="submit-link">Submit &gt;</button>
                </form>
            </div>
            <button class="link-btn" onclick="switchCard('registerCard')">Register</button>
        </div>

        <div id="registerCard" class="auth-card hidden">
            <div class="form-box">
                <h2>Register</h2>
                <form id="registerForm" onsubmit="executeRegistration(event)">
                    <input type="text" id="regName" placeholder="Username" required>
                    <input type="email" id="regEmail" placeholder="Email" required>
                    <input type="password" id="regPassword" placeholder="Password" required minlength="6">
                    
                    <div class="toggle-container">
                        <button type="button" id="roleArchitect" class="toggle-btn" onclick="setRole('architect')">Architect</button>
                        <button type="button" id="roleClient" class="toggle-btn active" onclick="setRole('client')">Client</button>
                    </div>

                    <input type="text" id="licenseInput" placeholder="Architect License" class="hidden">

                    <button type="submit" class="submit-link">Submit &gt;</button>
                </form>
            </div>
            <button class="link-btn" onclick="switchCard('loginCard')">Login</button>
        </div>

    </div>

    <script>
        function executeRegistration(event) {
            event.preventDefault();

            const fullName = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            const finalRole = (typeof selectedRole !== 'undefined') ? selectedRole : 'client';

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    database.ref('users/' + user.uid).set({
                        name: fullName,
                        email: email,
                        role: finalRole,
                        bio: finalRole === "architect" ? "I specialize in modern residential designs." : ""
                    }).then(() => {
                        alert("Account successfully created!");
                        window.location.href = finalRole === "architect" ? 'architect.html' : 'dashboard.html';
                    });
                })
                .catch((error) => {
                    alert("Registration Failed: " + error.message);
                });
        }

        function executeLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    database.ref('users/' + user.uid).once('value')
                        .then((snapshot) => {
                            const userData = snapshot.val();
                            if (userData) {
                                alert(`Welcome back, ${userData.name}!`);
                                window.location.href = userData.role === "architect" ? 'architect.html' : 'dashboard.html';
                            }
                        });
                })
                .catch((error) => {
                    alert("Login Failed: " + error.message);
                });
        }
    </script>

    <script src="app.js"></script>
</body>
</html>
